<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>אין חיבור - טיפוס ישראל</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3ede0;
        color: #2b2620;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .wrap {
        max-width: 420px;
      }
      h1 {
        font-size: 24px;
        margin: 16px 0 8px;
      }
      p {
        color: #5a5347;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #2b2620;
        color: #f3ede0;
        text-decoration: none;
        font-weight: bold;
      }
      svg {
        color: #b4361a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #211f1c;
          color: #ede9e1;
        }
        p {
          color: #b3aa9c;
        }
        a {
          background: #ede9e1;
          color: #211f1c;
        }
        svg {
          color: #e5674b;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3" />
        <circle cx="24" cy="24" r="4" fill="currentColor" />
      </svg>
      <h1>אין חיבור לאינטרנט</h1>
      <p>
        הדף הזה עדיין לא נשמר לצפייה אופליין. אם ביקרתם בו בעבר עם חיבור
        לרשת, נסו לחזור אליו - הוא כנראה נשמר במכשיר.
      </p>
      <a href="/climb-israel/">חזרה לעמוד הבית</a>
    </div>
  </body>
</html>
